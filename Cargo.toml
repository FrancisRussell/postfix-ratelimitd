[package]
name = "postfix-ratelimitd"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[dependencies]
arc-swap = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
regex-lite = "0.1"
redis = { version = "0.32", default-features = false, features = ["tokio-comp", "connection-manager", "tokio-rustls-comp", "script"] }
clap = { version = "4", default-features = false, features = ["derive", "std", "help", "usage", "error-context"] }
thiserror = "2"
humantime-serde = "1"
log = "0.4"
env_logger = { version = "0.11", default-features = false, features = ["humantime"] }
syslog = "7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "signal"] }
tokio-util = { version = "0.7", features = ["rt"] }

# The rustls ring feature is needed to provide a crypto backend.
[dependencies.rustls]
version = "0.23"
default-features = false
features = ["ring"]

[dev-dependencies]
tempfile = "3"

[features]
integration-tests = []
