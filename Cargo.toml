[package]
name = "postfix-ratelimitd"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Postfix SMTP access policy daemon that rate-limits recipients, backed by Valkey/Redis."

[dependencies]
arc-swap = "1"
clap = { version = "4", default-features = false, features = ["derive", "std", "help", "usage", "error-context", "env"] }
env_logger = { version = "0.11", default-features = false, features = ["humantime"] }
humantime = "2"
humantime-serde = "1"
json-rpc-types = "1"
libc = "0.2"
log = "0.4"
redis = { version = "1", default-features = false, features = ["tokio-comp", "connection-manager", "tokio-rustls-comp", "script"] }
regex-lite = "0.1"
# The rustls ring feature is needed to provide a crypto backend.
rustls = { version = "0.23", default-features = false, features = ["ring"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syslog = "7"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "signal", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
toml = { version = "1", default-features = false, features = ["std", "serde", "parse"] }

[dev-dependencies]
tempfile = "3"
toml = { version = "*", features = ["display"] }

[features]
integration-tests = []
